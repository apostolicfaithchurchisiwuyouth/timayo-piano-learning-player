<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Piano Learning Player</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div>
      <p class="eyebrow">PIANO LEARNING PLAYER</p>
      <h1>Learn the Piano</h1>
    </div>

    <button id="playButton" class="play-button">
      ▶ Play
    </button>
  </header>

  <main>

    <section class="song-card">

      <div>
        <span class="label">NOW PLAYING</span>
        <h2>My First Piano Piece</h2>
        <p id="status">Ready to play</p>
      </div>

      <div class="controls">
        <button id="pauseButton">⏸ Pause</button>
        <button id="restartButton">↻ Restart</button>
      </div>

    </section>


    <section class="practice-card">

      <div class="practice-header">
        <div>
          <span class="label">PRACTICE</span>
          <h2>Both Hands</h2>
        </div>

        <div class="tempo">
          <span>Speed</span>
          <select id="speedSelect">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
          </select>
        </div>
      </div>


      <div class="piano-wrapper">

        <div class="piano" id="piano">

          <!-- White keys -->

          <div class="key white" data-note="C4">C</div>
          <div class="key white" data-note="D4">D</div>
          <div class="key white" data-note="E4">E</div>
          <div class="key white" data-note="F4">F</div>
          <div class="key white" data-note="G4">G</div>
          <div class="key white" data-note="A4">A</div>
          <div class="key white" data-note="B4">B</div>
          <div class="key white" data-note="C5">C</div>

          <!-- Black keys -->

          <div class="key black" data-note="C#4">C#</div>
          <div class="key black" data-note="D#4">D#</div>
          <div class="key black" data-note="F#4">F#</div>
          <div class="key black" data-note="G#4">G#</div>
          <div class="key black" data-note="A#4">A#</div>

        </div>

      </div>

    </section>


    <section class="note-display">

      <span class="label">CURRENT NOTES</span>

      <div id="currentNotes">
        <span class="empty-note">—</span>
      </div>

    </section>

  </main>


  <footer>
    Piano Learning Player · Version 1
  </footer>


  <script src="script.js"></script>

</body>
</html>

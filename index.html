<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Piano Learning Player</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Remix Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- ==============================
       MOBILE ROTATION SCREEN
  =============================== -->

  <div class="rotate-screen">

    <div class="rotate-icon">
      <i class="ri-smartphone-line"></i>
    </div>

    <h2>Turn your phone sideways</h2>

    <p>
      Landscape mode gives you the best piano experience.
    </p>

  </div>


  <!-- ==============================
       APPLICATION
  =============================== -->

  <div class="app">


    <!-- ==============================
         TOP NAVIGATION
    =============================== -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-mark">
          <i class="ri-music-2-fill"></i>
        </div>

        <div>
          <span class="brand-label">
            PIANO LAB
          </span>

          <h1>
            Learn & Play
          </h1>
        </div>

      </div>


      <div class="top-actions">

        <button
          class="icon-button"
          aria-label="Settings"
        >
          <i class="ri-settings-3-line"></i>
        </button>

      </div>

    </header>



    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main class="main-content">


      <!-- SONG HEADER -->

      <section class="lesson-header">

        <div class="lesson-heading">

          <span class="section-label">
            CURRENT LESSON
          </span>

          <h2>
            My First Piano Piece
          </h2>

          <p>
            Practice each hand separately, then bring them together.
          </p>

        </div>


        <div class="lesson-meta">

          <div class="meta-item">
            <i class="ri-time-line"></i>
            <span>Beginner</span>
          </div>

          <div class="meta-item">
            <i class="ri-music-2-line"></i>
            <span>Both Hands</span>
          </div>

        </div>

      </section>



      <!-- ==============================
           PRACTICE CONTROLS
      =============================== -->

      <section class="practice-toolbar">


        <div class="hand-selector">

          <button
            class="hand-button active"
            data-mode="both"
          >
            <i class="ri-hand-heart-line"></i>
            <span>Both Hands</span>
          </button>


          <button
            class="hand-button"
            data-mode="right"
          >
            <i class="ri-hand-heart-line"></i>
            <span>Right Hand</span>
          </button>


          <button
            class="hand-button"
            data-mode="left"
          >
            <i class="ri-hand-heart-line"></i>
            <span>Left Hand</span>
          </button>

        </div>



        <div class="toolbar-right">

          <div class="speed-control">

            <i class="ri-speed-line"></i>

            <span>
              Speed
            </span>

            <select id="speedSelect">

              <option value="0.5">
                50%
              </option>

              <option value="0.75">
                75%
              </option>

              <option value="1" selected>
                100%
              </option>

              <option value="1.25">
                125%
              </option>

            </select>

          </div>

        </div>

      </section>



      <!-- ==============================
           NOTE INDICATOR
      =============================== -->

      <section class="now-playing">

        <div class="now-playing-label">

          <span class="live-dot"></span>

          <span>
            NOW PLAYING
          </span>

        </div>


        <div
          id="currentNotes"
          class="current-notes"
        >

          <span class="empty-note">
            Ready when you are
          </span>

        </div>

      </section>


    </main>



    <!-- ==============================
         STICKY PIANO AREA
    =============================== -->

    <section class="piano-dock">


      <div class="piano-topbar">

        <div class="piano-title">

          <i class="ri-piano-line"></i>

          <span>
            Piano
          </span>

          <small>
            C3 — C6
          </small>

        </div>


        <div
          id="status"
          class="play-status"
        >
          Ready
        </div>

      </div>



      <!-- PIANO -->

      <div class="piano-stage">

        <div
          id="piano"
          class="piano"
        ></div>

      </div>



      <!-- ==============================
           STICKY PLAYBACK CONTROLS
      =============================== -->

      <div class="playback-bar">


        <button
          id="restartButton"
          class="playback-icon"
          aria-label="Restart"
        >

          <i class="ri-restart-line"></i>

        </button>


        <button
          id="playButton"
          class="main-play"
          aria-label="Play"
        >

          <i class="ri-play-fill"></i>

        </button>


        <button
          id="pauseButton"
          class="playback-icon"
          aria-label="Pause"
        >

          <i class="ri-pause-line"></i>

        </button>


      </div>

    </section>



    <!-- FOOTER -->

    <footer>

      <span>
        Piano Lab
      </span>

      <span>
        Version 1
      </span>

    </footer>

  </div>


  <!-- Tone.js -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <script src="script.js"></script>

</body>
</html>

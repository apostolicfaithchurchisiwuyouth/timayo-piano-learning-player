<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Piano Lab</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Remix Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MOBILE ROTATION SCREEN -->

  <div class="rotate-screen">

    <div class="rotate-icon">
      <i class="ri-smartphone-line"></i>
    </div>

    <h2>Turn your phone sideways</h2>

    <p>
      Landscape mode gives you more room to play the piano.
    </p>

  </div>


  <!-- APPLICATION -->

  <div class="app">


    <!-- TOP BAR -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-mark">
          <i class="ri-piano-fill"></i>
        </div>

        <div class="brand-copy">

          <span class="brand-label">
            PIANO LAB
          </span>

          <h1>
            Learn & Play
          </h1>

        </div>

      </div>


      <button
        class="icon-button"
        id="settingsButton"
        aria-label="Settings"
      >
        <i class="ri-settings-3-line"></i>
      </button>

    </header>



    <!-- MAIN -->

    <main class="main-content">


      <!-- CURRENT PIECE -->

      <section class="piece-header">

        <div>

          <span class="section-label">
            CURRENT PIECE
          </span>

          <h2 id="pieceTitle">
            Gentle Beginning
          </h2>

          <p id="pieceSubtitle">
            Beginner Piano Study
          </p>

        </div>


        <div class="piece-badge">

          <i class="ri-music-2-line"></i>

          <span>
            Piano Study
          </span>

        </div>

      </section>



      <!-- CURRENT NOTES -->

      <section class="now-playing">

        <div class="now-playing-left">

          <span class="live-dot"></span>

          <span>
            NOW PLAYING
          </span>

        </div>


        <div
          id="currentNotes"
          class="current-notes"
        >

          <span class="empty-note">
            Ready when you are
          </span>

        </div>

      </section>


    </main>



    <!-- STICKY PIANO -->

    <section class="piano-dock">


      <!-- PIANO INFORMATION -->

      <div class="piano-info">

        <div class="piano-name">

          <i class="ri-piano-line"></i>

          <div>

            <strong>
              Piano Lab
            </strong>

            <span>
              Digital Learning Piano
            </span>

          </div>

        </div>


        <div class="range-label">
          C2 — C5
        </div>

      </div>



      <!-- QUICK CONTROLS -->

      <div class="quick-controls">


        <!-- PIECE -->

        <div class="control-wrapper">

          <button
            class="quick-control"
            id="pieceControl"
            aria-label="Select piece"
          >

            <i class="ri-music-2-line"></i>

            <span>
              Piece
            </span>

            <i class="ri-arrow-down-s-line"></i>

          </button>


          <div
            class="control-menu"
            id="pieceMenu"
          >

            <button data-piece="gentle">
              <span>
                Gentle Beginning
              </span>

              <small>
                Beginner
              </small>
            </button>


            <button data-piece="allofme">
              <span>
                All of Me
              </span>

              <small>
                Practice piece
              </small>
            </button>

          </div>

        </div>



        <!-- HAND -->

        <div class="control-wrapper">

          <button
            class="quick-control"
            id="handControl"
            aria-label="Select hand"
          >

            <i class="ri-hand-heart-line"></i>

            <span>
              Both
            </span>

            <i class="ri-arrow-down-s-line"></i>

          </button>


          <div
            class="control-menu"
            id="handMenu"
          >

            <button data-hand="both">
              <i class="ri-hand-heart-line"></i>
              <span>Both Hands</span>
            </button>

            <button data-hand="right">
              <i class="ri-hand-heart-line"></i>
              <span>Right Hand</span>
            </button>

            <button data-hand="left">
              <i class="ri-hand-heart-line"></i>
              <span>Left Hand</span>
            </button>

          </div>

        </div>



        <!-- SPEED -->

        <div class="control-wrapper">

          <button
            class="quick-control"
            id="speedControl"
            aria-label="Change speed"
          >

            <i class="ri-speed-line"></i>

            <span id="speedLabel">
              100%
            </span>

            <i class="ri-arrow-down-s-line"></i>

          </button>


          <div
            class="control-menu speed-menu"
            id="speedMenu"
          >

            <button data-speed="0.5">
              50%
            </button>

            <button data-speed="0.75">
              75%
            </button>

            <button data-speed="1">
              100%
            </button>

            <button data-speed="1.25">
              125%
            </button>

          </div>

        </div>


      </div>



      <!-- PIANO -->

      <div class="piano-stage">

        <div
          id="piano"
          class="piano"
        ></div>

      </div>



      <!-- PLAYBACK -->

      <div class="playback-bar">


        <button
          id="restartButton"
          class="playback-icon"
          aria-label="Replay"
        >

          <i class="ri-replay-10-line"></i>

        </button>


        <button
          id="playButton"
          class="main-play"
          aria-label="Play"
        >

          <i
            id="playIcon"
            class="ri-play-fill"
          ></i>

        </button>


        <div
          id="status"
          class="play-status"
        >
          Ready
        </div>

      </div>


    </section>



    <!-- FOOTER -->

    <footer>

      <span>
        Piano Lab
      </span>

      <span>
        Digital Piano Learning System
      </span>

    </footer>

  </div>


  <!-- Tone.js -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <script src="script.js"></script>

</body>
</html>
